[project]
name = "toolbox_api"
version = "1.0.0"
description = "Hub to centralize tools used in Newnet."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.147.0",
    "psycopg>=3.3.6",
    "psycopg-binary>=3.3.6",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.16.0",
    "pydantic[email]>=2.14.1",
    "python-jose[cryptography]>=3.5.0",
    "ruff>=0.17.1",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
toolbox_api = "toolbox_api.main:app"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
